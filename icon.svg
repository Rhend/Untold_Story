<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
	<!-- Icône du jeu : vieux grimoire abîmé, ouvert, tons beige cassé / parchemin. -->
	<defs>
		<linearGradient id="pageGauche" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#efe3c4"/>
			<stop offset="0.72" stop-color="#e6d6b2"/>
			<stop offset="1" stop-color="#bda678"/>
		</linearGradient>
		<linearGradient id="pageDroite" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#bda678"/>
			<stop offset="0.28" stop-color="#e6d6b2"/>
			<stop offset="1" stop-color="#f3e9cd"/>
		</linearGradient>
	</defs>

	<!-- Couverture de cuir usée -->
	<path d="M64 26 C47 15 27 13 9 18 L4 99 C22 94 46 97 64 108 C82 97 106 94 124 99 L119 18 C101 13 81 15 64 26 Z"
		fill="#4c3826" stroke="#2d2013" stroke-width="3" stroke-linejoin="round"/>

	<!-- Tranche des pages empilées -->
	<path d="M64 99 C48 90 28 87 10 91 L9 95 C27 91 47 94 64 104 C81 94 101 91 119 95 L118 91 C100 87 80 90 64 99 Z"
		fill="#cdb98e"/>

	<!-- Page de gauche, bord extérieur rongé -->
	<path d="M62 32 C46 22 30 20 14 24 L13 39 15 50 12 63 14 76 10 92 C27 88 46 91 62 100 Z"
		fill="url(#pageGauche)" stroke="#a38a5c" stroke-width="1.5" stroke-linejoin="round"/>

	<!-- Page de droite, bord extérieur rongé -->
	<path d="M66 32 C82 22 98 20 114 24 L115 41 113 53 116 66 114 79 118 92 C101 88 82 91 66 100 Z"
		fill="url(#pageDroite)" stroke="#a38a5c" stroke-width="1.5" stroke-linejoin="round"/>

	<!-- Ombre de la reliure centrale -->
	<path d="M60 33 Q64 29 68 33 L68 98 Q64 103 60 98 Z" fill="#6b5637" opacity="0.4"/>

	<!-- Lignes d'écriture -->
	<g fill="none" stroke="#8a7146" stroke-width="2.6" stroke-linecap="round" opacity="0.7">
		<path d="M22 40 C34 36 45 36 55 40"/>
		<path d="M21 50 C33 46 45 46 55 50"/>
		<path d="M21 60 C33 56 45 56 55 60"/>
		<path d="M21 70 C33 66 45 66 55 70"/>
		<path d="M22 80 C31 77 39 76 46 78"/>
		<path d="M73 40 C83 36 95 36 106 40"/>
		<path d="M73 50 C83 46 95 46 107 50"/>
		<path d="M73 60 C83 56 95 56 107 60"/>
		<path d="M73 70 C83 66 95 66 106 70"/>
	</g>

	<!-- Taches et usure du parchemin -->
	<ellipse cx="40" cy="84" rx="7" ry="4" fill="#c4ac7e" opacity="0.55"/>
	<ellipse cx="99" cy="80" rx="5.5" ry="3.5" fill="#c4ac7e" opacity="0.5"/>
	<ellipse cx="29" cy="31" rx="4.5" ry="3" fill="#c4ac7e" opacity="0.45"/>

	<!-- Ruban marque-page élimé -->
	<path d="M80 22.5 L88.5 21.5 L90 44 L85 38.5 L81 45 Z" fill="#7a3126" stroke="#54211a" stroke-width="1"/>
</svg>
